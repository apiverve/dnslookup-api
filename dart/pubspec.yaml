name: apiverve_dnslookup
description: "DNS Lookup retrieves published DNS records for any domain, including IPv4 (A), IPv6 (AAAA), and mail exchange (MX) servers. It provides hostnames, priorities, and dual-stack status flags, while paid plans add TXT, CNAME, and nameserver records."
version: 1.2.5
homepage: https://apiverve.com/marketplace/dnslookup?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/dnslookup-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
