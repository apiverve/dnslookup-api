openapi: 3.0.4
info:
  title: DNS Lookup
  description: >-
    DNS Lookup retrieves published DNS records for any domain, including IPv4
    (A), IPv6 (AAAA), and mail exchange (MX) servers. It provides hostnames,
    priorities, and dual-stack status flags, while paid plans add TXT, CNAME,
    and nameserver records.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/dnslookup:
    get:
      summary: DNS Lookup
      description: Lookup the DNS records of a domain
      operationId: dnslookup
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          required: true
          description: >-
            The domain or DNS name to look up, without the protocol. Underscore
            names work too, such as _dmarc.example.com or _sip._tcp.example.com
          example: myspace.com
        - name: type
          in: query
          schema:
            type: string
          required: false
          description: >-
            Comma-separated record types to look up. Leave it out for A, AAAA,
            CNAME, MX, NS, PTR, SRV, SOA, TXT and CAA. HTTPS, SVCB, TLSA, NAPTR,
            DS and DNSKEY are returned only when named here
          example: A,MX,TXT
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  domain: google.com
                  records:
                    A:
                      - 172.253.156.100
                      - 172.253.156.113
                      - 172.253.156.101
                      - 172.253.156.139
                      - 172.253.156.138
                      - 172.253.156.102
                    AAAA:
                      - 2607:f8b0:4023:100d::65
                      - 2607:f8b0:4023:100d::8a
                      - 2607:f8b0:4023:100d::71
                      - 2607:f8b0:4023:100d::64
                    CNAME: null
                    MX:
                      - exchange: smtp.google.com
                        priority: 10
                    NS:
                      - ns4.google.com
                      - ns3.google.com
                      - ns2.google.com
                      - ns1.google.com
                    PTR: null
                    SRV: null
                    SOA:
                      nsname: ns1.google.com
                      hostmaster: dns-admin.google.com
                      serial: 1005474929
                      refresh: 900
                      retry: 900
                      expire: 1800
                      minttl: 60
                    TXT:
                      - - onetrust-domain-verification=0d477fe608074e6f9c12bca7826035cc
                      - - work-accounts-domain-verification=Tcj6JjIMZOw2KsSEw2Nt2rLae89tN6
